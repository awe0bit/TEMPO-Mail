name: Build native iOS runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - app.config.ts
      - eas.json
      - App/Resources/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - app.config.ts
      - eas.json
      - App/Resources/**
      - .github/workflows/ios.yml

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Generate native iOS project
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        run: cd ios && pod install --repo-update
      - name: Build unsigned device app
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          mkdir -p build/Payload
          ditto "$APP_PATH" "build/Payload/$(basename "$APP_PATH")"
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/TEMPOMail-native-2-unsigned.ipa
          shasum -a 256 build/TEMPOMail-native-2-unsigned.ipa > build/TEMPOMail-native-2-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPOMail-native-2-${{ github.run_number }}
          path: |
            build/TEMPOMail-native-2-unsigned.ipa
            build/TEMPOMail-native-2-unsigned.ipa.sha256
          retention-days: 14
